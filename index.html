<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Khata Register</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

  <!-- ===== AUTH SCREEN ===== -->
  <div id="authScreen" class="auth-wrap">
    <div class="auth-card">
      <h1 class="auth-title">Expense Register</h1>
      <p class="auth-sub" id="authSubText">Sign in to continue</p>

      <div class="field">
        <label for="authEmail">Email</label>
        <input type="email" id="authEmail" placeholder="you@example.com"/>
      </div>
      <div class="field">
        <label for="authPassword">Password</label>
        <input type="password" id="authPassword" placeholder="Enter password"/>
      </div>
      <div class="field" id="authConfirmField" style="display:none;">
        <label for="authPasswordConfirm">Confirm Password</label>
        <input type="password" id="authPasswordConfirm" placeholder="Re-enter password"/>
      </div>

      <p class="auth-error" id="authError"></p>

      <button class="btn-primary" id="authSubmitBtn">Login</button>

      <p class="auth-switch" id="authSwitchText"></p>
    </div>
  </div>

  <!-- ===== MAIN APP ===== -->
  <div class="container" id="appMain" style="display:none;">

    <header class="header">
      <div class="header-top">
        <div>
          <h1>Expense Register</h1>
          <p>Track student expenses</p>
        </div>
        <div class="header-right">
          <span class="user-email" id="loggedInEmail"></span>
          <button class="btn-logout" id="logoutBtn">Logout</button>
        </div>
      </div>
    </header>

    <section class="card">
      <div class="card-header-row">
        <h2 class="section-title">Add New Entry</h2>
        <button class="myself-btn" id="myselfToggleBtn" type="button">
          <span class="myself-icon">＋</span>
          Myself
        </button>
      </div>

      <div class="grid-2">
        <div class="field">
          <label for="studentName">Name</label>
          <input type="text" id="studentName" placeholder="Student name"/>
        </div>
        <div class="field">
          <label for="lenderName">Boy's Name <span class="tip-text">(tip: different names create different accounts)</span></label>
          <input type="text" id="lenderName" placeholder="Your name"/>
        </div>
      </div>

      <div class="grid-3">
        <div class="field">
          <label for="amount">Amount (Rs.)</label>
          <div class="prefix-wrap">
            <span class="prefix">Rs.</span>
            <input type="number" id="amount" placeholder="0" min="1"/>
          </div>
        </div>
        <div class="field">
          <label for="date">Date</label>
          <input type="date" id="date"/>
        </div>
        <div class="field">
          <label for="time">Time</label>
          <input type="time" id="time"/>
        </div>
      </div>

      <div class="field">
        <label for="reason">Purpose / Reason</label>
        <input type="text" id="reason" placeholder="What was the money taken for"/>
      </div>

      <button class="btn-primary" id="submitBtn">Add List</button>
    </section>

    <section class="card">
      <div class="records-header">
        <div>
          <h2 class="section-title">Student Accounts</h2>
          <span class="count-badge" id="studentCountBadge">0 Students</span>
        </div>
      </div>
      <div id="studentAccountsArea"></div>
    </section>

    <section class="card">
      <div class="records-header">
        <div>
          <h2 class="section-title" id="recordsTitle">All Records</h2>
          <span class="count-badge" id="countBadge">0 Records</span>
        </div>
        <div class="records-header-actions">
          <button class="btn-clear-filter" id="clearFilterBtn" style="display:none;" onclick="clearFilter()">
            Show All
          </button>
          <button class="btn-download-all" id="downloadAllBtn" style="display:none;" onclick="downloadAllPDF()">
            Download receipts
          </button>
        </div>
      </div>

      <div id="tableArea"></div>

      <div class="total-bar" id="totalBar" style="display:none;">
        <span class="total-label" id="totalLabel">Total Debt</span>
        <span class="total-value" id="totalAmount">Rs. 0</span>
      </div>
    </section>

  </div>

  <!-- ===== MYSELF PRIVATE PAGE (opens on top when Myself is clicked) ===== -->
  <div class="myself-page" id="myselfPage" style="display:none;">
    <div class="myself-page-inner">
      <div class="myself-page-header">
        <h1>My Account</h1>
        <button class="btn-close-myself" id="closeMyselfBtn" type="button">Close ✕</button>
      </div>

      <section class="card">
        <h2 class="section-title">My Loans</h2>

        <div class="field">
          <label for="ownFromName">Given By</label>
          <input type="text" id="ownFromName" placeholder="Person's name"/>
        </div>

        <div class="grid-3">
          <div class="field">
            <label for="ownAmount">Amount (Rs.)</label>
            <div class="prefix-wrap">
              <span class="prefix">Rs.</span>
              <input type="number" id="ownAmount" placeholder="0" min="1"/>
            </div>
          </div>
          <div class="field">
            <label for="ownDate">Date</label>
            <input type="date" id="ownDate"/>
          </div>
          <div class="field">
            <label for="ownTime">Time</label>
            <input type="time" id="ownTime"/>
          </div>
        </div>

        <div class="field">
          <label for="ownReason">Purpose / Reason</label>
          <input type="text" id="ownReason" placeholder="What the money was for"/>
        </div>

        <button class="btn-primary" id="ownSubmitBtn">Add Entry</button>
      </section>

      <section class="card">
        <div class="records-header">
          <div>
            <h2 class="section-title">People I Pay Back</h2>
            <span class="count-badge" id="ownStudentCountBadge">0 People</span>
          </div>
        </div>
        <div id="ownAccountsArea"></div>
      </section>

      <section class="card">
        <div class="records-header">
          <div>
            <h2 class="section-title" id="ownRecordsTitle">My Loan History</h2>
            <span class="count-badge" id="ownCountBadge">0 Records</span>
          </div>
          <div class="records-header-actions">
            <button class="btn-clear-filter" id="ownClearFilterBtn" style="display:none;" onclick="clearOwnFilter()">
              Show All
            </button>
            <button class="btn-download-all" id="ownDownloadAllBtn" style="display:none;" onclick="downloadOwnAllPDF()">
              Download receipts
            </button>
          </div>
        </div>

        <div id="ownTableArea"></div>

        <div class="total-bar" id="ownTotalBar" style="display:none;">
          <span class="total-label" id="ownTotalLabel">Total Borrowed</span>
          <span class="total-value" id="ownTotalAmount">Rs. 0</span>
        </div>
      </section>
    </div>
  </div>

  <div id="toast">Entry added</div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
